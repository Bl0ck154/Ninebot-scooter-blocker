name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode stable signing keystore
        run: |
          mkdir -p ci
          base64 -d ci/stable-debug-keystore.b64 > ci/ninebot-debug.keystore

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test exact SHU Ninebot protocol
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build stable-signed APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ninebot-scooter-blocker-v0.5.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninebot-scooter-blocker-v0.5.0-apk
          path: Ninebot-scooter-blocker-v0.5.0.apk
          if-no-files-found: error

      - name: Publish v0.5.0 release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then
            gh release upload v0.5.0 Ninebot-scooter-blocker-v0.5.0.apk --clobber
          else
            gh release create v0.5.0 Ninebot-scooter-blocker-v0.5.0.apk \
              --target "${GITHUB_SHA}" \
              --title "Ninebot Scooter Blocker v0.5.0" \
              --notes "Reimplements the classic Ninebot G30 lock path from ScooterHacking Utility 2.7. Removes the incorrect INIT/PING/PAIR flow and sends SHU's exact classic lock frame: 5A A5 01 3E 20 32 70 01 FD FE over Nordic UART."
          fi
