name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=Ninebot-scooter-blocker-v$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Decode stable signing key
        if: github.event_name != 'pull_request'
        env:
          STABLE_SIGNING_KEYSTORE_BASE64: ${{ secrets.STABLE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$STABLE_SIGNING_KEYSTORE_BASE64"
          mkdir -p ci
          printf '%s' "$STABLE_SIGNING_KEYSTORE_BASE64" | base64 -d > ci/ninebot-debug.keystore

      - name: Prepare optional production signing
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > ci/release.keystore
            echo "Production release signing enabled."
          else
            echo "Using the existing stable signing key for the optimized release APK."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint, tests and APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Verify optimized release signature
        if: github.event_name != 'pull_request'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Report APK size
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          else
            RELEASE_APK=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          test -f "$RELEASE_APK"
          DEBUG_BYTES="$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)"
          RELEASE_BYTES="$(stat -c%s "$RELEASE_APK")"
          echo "Debug APK:   $DEBUG_BYTES bytes"
          echo "Release APK: $RELEASE_BYTES bytes"
          RELEASE_APK="$RELEASE_APK" python3 - <<'PY'
          import os
          d = os.path.getsize('app/build/outputs/apk/debug/app-debug.apk')
          r = os.path.getsize(os.environ['RELEASE_APK'])
          saved = d-r
          pct = saved*100/d if d else 0
          print(f'R8/resource shrinking saved {saved} bytes ({pct:.1f}%).')
          PY

      - name: Select publishable APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Upload workflow artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Ninebot-scooter-blocker-v${{ env.VERSION_NAME }}-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish release APK
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          NOTES='Notification lifecycle resynchronization hotfix. Fixes a remaining case where the BLE repository could already be READY and lock/unlock worked while the foreground notification was still showing an old offline/reconnect snapshot. The service now distinguishes merely being alive from having a READY notification, accepts an explicit one-shot SYNC when needed, and can self-heal a live service whose foreground notification was stopped or stale. Reconnect state transitions remain immediate. v0.12.3 READY callback guards, v0.12.2 reboot/discovery fallback, G30 protocol bytes, ride statistics and charging logic are unchanged.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --target "${GITHUB_SHA}" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_NAME" \
              --target "${GITHUB_SHA}" \
              --title "Ninebot Scooter Blocker $TAG" \
              --notes "$NOTES"
          fi
