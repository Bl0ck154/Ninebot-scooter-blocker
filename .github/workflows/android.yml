name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test Ninebot protocol
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug-signed APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ninebot-scooter-blocker-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninebot-scooter-blocker-debug-apk
          path: Ninebot-scooter-blocker-debug.apk
          if-no-files-found: error

      - name: Publish v0.1.0 release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 Ninebot-scooter-blocker-debug.apk --clobber
          else
            gh release create v0.1.0 Ninebot-scooter-blocker-debug.apk \
              --target "${GITHUB_SHA}" \
              --title "Ninebot Scooter Blocker v0.1.0" \
              --notes "First Android test build. Debug-signed APK for testing the one-tap Ninebot G30 software lock command."
          fi
