name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=Ninebot-scooter-blocker-v$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Decode stable signing key
        env:
          STABLE_SIGNING_KEYSTORE_BASE64: ${{ secrets.STABLE_SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$STABLE_SIGNING_KEYSTORE_BASE64"
          mkdir -p ci
          printf '%s' "$STABLE_SIGNING_KEYSTORE_BASE64" | base64 -d > ci/ninebot-debug.keystore

      - name: Prepare optional production signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > ci/release.keystore
            echo "Production release signing enabled."
          else
            echo "Using the existing stable signing key for the optimized release APK."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint, tests and APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon :app:lintRelease :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Verify optimized release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Report APK size
        run: |
          DEBUG_BYTES="$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)"
          RELEASE_BYTES="$(stat -c%s app/build/outputs/apk/release/app-release.apk)"
          echo "Debug APK:   $DEBUG_BYTES bytes"
          echo "Release APK: $RELEASE_BYTES bytes"
          python3 - <<'PY'
          import os
          d = os.path.getsize('app/build/outputs/apk/debug/app-debug.apk')
          r = os.path.getsize('app/build/outputs/apk/release/app-release.apk')
          saved = d-r
          pct = saved*100/d if d else 0
          print(f'R8/resource shrinking saved {saved} bytes ({pct:.1f}%).')
          PY

      - name: Select publishable APK
        run: cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninebot-scooter-blocker-v${{ env.VERSION_NAME }}-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          NOTES='Statistics overhaul. Rides now split from the last real movement instead of BLE uptime, so a scooter that stays connected while parked cannot keep one session alive for hours. Sessions start only when movement is detected and short pauses still stay inside the configured 20/30/60-minute window. The Statistics screen is rebuilt around a tappable 17-week GitHub-style distance heatmap, native vertical scrolling, Day/Week/Month segmented controls, date navigation, period-specific ride lists, and a clearer inactivity timeout setting. Legacy open v1 ride rows are safely closed once during database migration so old telemetry-based timestamps cannot merge into a new ride.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --target "${GITHUB_SHA}" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_NAME" \
              --target "${GITHUB_SHA}" \
              --title "Ninebot Scooter Blocker $TAG" \
              --notes "$NOTES"
          fi
