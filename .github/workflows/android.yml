name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build version to 0.7.2
        run: |
          sed -i 's/versionCode = 13/versionCode = 14/' app/build.gradle.kts
          sed -i 's/versionName = "0.7.1"/versionName = "0.7.2"/' app/build.gradle.kts

      - name: Decode stable signing keystore
        run: |
          mkdir -p ci
          base64 -d ci/stable-debug-keystore.b64 > ci/ninebot-debug.keystore

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test SHU protocol and crypto packets
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build stable-signed APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ninebot-scooter-blocker-v0.7.2.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninebot-scooter-blocker-v0.7.2-apk
          path: Ninebot-scooter-blocker-v0.7.2.apk
          if-no-files-found: error

      - name: Publish v0.7.2 release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.7.2 >/dev/null 2>&1; then
            gh release upload v0.7.2 Ninebot-scooter-blocker-v0.7.2.apk --clobber
          else
            gh release create v0.7.2 Ninebot-scooter-blocker-v0.7.2.apk \
              --target "${GITHUB_SHA}" \
              --title "Ninebot Scooter Blocker v0.7.2" \
              --notes "Keeps the known-good v0.6.0 SHU transport and fixes the lock UI so connection state no longer disables the toggle. The lock/unlock request can be queued while Bluetooth authentication is still in progress. The card shows only lock state; connection/authentication text is separate below it. Scooter scanning remains restricted to real advertised NBScooter/Ninebot/Segway names."
          fi
