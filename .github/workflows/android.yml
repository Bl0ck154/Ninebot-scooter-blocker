name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode stable debug keystore
        run: |
          mkdir -p ci
          base64 -d ci/stable-debug-keystore.b64 > ci/ninebot-debug.keystore

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint, tests and debug APK
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Verify stable debug signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release when release key is configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > ci/release.keystore
            gradle --no-daemon :app:assembleRelease
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          else
            echo "Release signing secrets are not configured; publishing the stable-signed debug APK."
          fi

      - name: Select publishable APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk Ninebot-scooter-blocker-v0.8.1.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk Ninebot-scooter-blocker-v0.8.1.apk
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninebot-scooter-blocker-v0.8.1-apk
          path: Ninebot-scooter-blocker-v0.8.1.apk
          if-no-files-found: error

      - name: Publish v0.8.1 release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES='Compact dashboard refresh for Ninebot Max G30. Fixes remaining-range scaling to 10 m units, adds explicit Locked/Unlocked indicator, one dynamic LOCK/UNLOCK notification action, smaller battery-optimization help, compact telemetry grid, refreshed controls and a new adaptive launcher icon. Existing SHU 2.7 authentication and lock/unlock packet path is unchanged.'
          if gh release view v0.8.1 >/dev/null 2>&1; then
            gh release upload v0.8.1 Ninebot-scooter-blocker-v0.8.1.apk --clobber
            gh release edit v0.8.1 --notes "$NOTES"
          else
            gh release create v0.8.1 Ninebot-scooter-blocker-v0.8.1.apk \
              --target "${GITHUB_SHA}" \
              --title "Ninebot Scooter Blocker v0.8.1" \
              --notes "$NOTES"
          fi
