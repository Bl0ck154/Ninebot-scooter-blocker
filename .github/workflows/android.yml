name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=Ninebot-scooter-blocker-v$VERSION_NAME.apk" >> "$GITHUB_ENV"

      - name: Decode stable debug keystore
        run: |
          mkdir -p ci
          base64 -d ci/stable-debug-keystore.b64 > ci/ninebot-debug.keystore

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Lint, tests and debug APK
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Verify stable debug signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Build signed release when release key is configured
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > ci/release.keystore
            gradle --no-daemon :app:assembleRelease
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          else
            echo "Release signing secrets are not configured; publishing the stable-signed debug APK."
          fi

      - name: Select publishable APK
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ninebot-scooter-blocker-v${{ env.VERSION_NAME }}-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION_NAME"
          NOTES='Live scooter companion update: fixes Android 15+ top insets, reads actual Ninebot lock state from the read-only boolean status register, keeps BLE connected when only the persistent-notification toggle is turned off, adds an always-visible compact lock control in the foreground notification, raises the live notification channel priority, adds separate configurable full-charge sound alerts, and makes the dashboard title model-aware. G30 remains the hardware-tested baseline; compatible legacy Ninebot Proto2 scooters are experimental.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --clobber
            gh release edit "$TAG" --target "${GITHUB_SHA}" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK_NAME" \
              --target "${GITHUB_SHA}" \
              --title "Ninebot Scooter Blocker $TAG" \
              --notes "$NOTES"
          fi
