name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What problem would this solve during normal scooter use?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: scooter
    attributes:
      label: Relevant scooter model
      placeholder: Ninebot Max G30, or not model-specific
  - type: checkboxes
    id: scope
    attributes:
      label: Project scope
      options:
        - label: This request does not require speed-limit changes, firmware flashing, region changes, or bypassing ownership controls.
          required: true
