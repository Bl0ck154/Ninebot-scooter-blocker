name: Bug report
description: Report a reproducible problem with the app
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include scooter serial numbers, BLE addresses, signing material, or private ride data.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 0.12.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android device and version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: input
    id: scooter
    attributes:
      label: Scooter model and firmware
      placeholder: Ninebot Max G30; firmware version if known
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the app
        2. Connect to the scooter
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Remove all personal and device identifiers first.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed serial numbers, BLE addresses, ride data, and other personal identifiers.
          required: true
        - label: This report does not disclose a security vulnerability or signing material.
          required: true
